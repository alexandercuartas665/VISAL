name: Build & publish Visal image

# CI + publicacion de la imagen Docker del Visal SuperAdmin a GitHub Container
# Registry (GHCR).
#
# Flujo:
#   - En pull_request a main: solo corre el gate de tests (no publica).
#   - En push a main: corre tests y, SOLO si pasan, publica la imagen :latest.
#   - En tags semver (vX.Y.Z): corre tests y publica la imagen etiquetada.
# El servidor de produccion solo necesita hacer `docker compose pull && up`.
#
# El job de tests es un GATE: build-and-push depende de el (needs: tests), de modo
# que un esquema o codigo roto nunca llega a GHCR ni, por lo tanto, a produccion.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # tambien permite disparar manualmente desde la UI

env:
  REGISTRY: ghcr.io
  # GHCR exige minusculas; el repo se llama VISAL (uppercase) por eso lo fijamos hardcoded.
  IMAGE_NAME: alexandercuartas665/visal/superadmin

jobs:
  tests:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore apps/backend/Visal.sln

      - name: Build
        run: dotnet build apps/backend/Visal.sln -c Release --no-restore

      # Las pruebas de integracion usan Testcontainers (postgres:16-alpine); el runner
      # ubuntu-latest trae Docker, asi que no se necesita servicio aparte ni secretos.
      - name: Test
        run: dotnet test apps/backend/Visal.sln -c Release --no-build --verbosity normal

  build-and-push:
    name: Build & push image
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile.superadmin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_SHA se propaga al build para que MSBuild inyecte el SHA real como
          # AssemblyMetadata (el chip del sidebar lo lee). Sin esto, dentro del
          # contenedor de build no hay .git y git rev-parse falla, quedando el
          # mensaje de error como version.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
